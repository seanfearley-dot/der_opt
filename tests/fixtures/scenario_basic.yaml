name: test_house
time_grid:
  resolution_minutes: 60
  horizon_steps: 4
  start: "2026-06-01T00:00:00"
devices:
  - type: battery
    name: battery
    params:
      capacity_kwh: 10
      p_max_charge_kw: 5
      p_max_discharge_kw: 5
      degradation_cost_per_kwh: 0.01
  - type: solar
    name: solar
    params:
      available_kw: [0, 2, 5, 1]
value_streams:
  - type: energy_arbitrage
    params:
      import_price: {type: constant, price: 0.2}
      export_price: {type: constant, price: 0.05}
external_load: [1, 1, 3, 3]
poi_limit_kw: 20
