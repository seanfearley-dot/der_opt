# Six homes on two transformers, read from files in the input data spec
# (docs/INPUT_DATA_SPEC.md) -- the template for running your own premises. A study
# (docs/POPULATION_MODEL_SPEC.md): the population's files, the assumptions for every
# premise, and the feeder analysis. Run with:
#   der-opt run examples/scenarios/feeder_from_files.yaml -o out/files
# Check your own files first:
#   der-opt check-data data/timeseries.csv --premises data/premises.csv --network data/network.csv
#   der-opt check-data data/devices.csv --premises data/premises.csv
#
# ../data/spec_sample/ is synthetic (generated, not real premises):
# home_05 is metered (import_kw/export_kw); the rest are gross load with the solar,
# batteries and EVs devices.csv lists. Tariffs and export programs are per premise
# (premises.csv); device behavior is set here, as defaults by device type.

extends:
  - ../library/time/2026-07-13T12_72x60min.yaml
  - ../library/study/homes_bill.yaml # each premise's own bill: nbt_bill or nem2_bill by its export program
  - ../library/study/device_params.yaml # battery and EV behavior; sizes come from devices.csv

name: feeder_from_files

population:
  premises: ../data/spec_sample/premises.csv
  devices: ../data/spec_sample/devices.csv
  timeseries: [../data/spec_sample/timeseries.csv]
  network: ../data/spec_sample/network.csv
  tz: America/Los_Angeles

tariffs:
  dir: ../data/tariffs # premises.csv `tariff` names a file here
  programs: # settings for each export_program named in premises.csv
    nbt: {export_rates_csv: ../data/export_rates/pge_nbt_eec_2026.csv, acc_plus_per_kwh: 0.0088}
    nem2: {nsc_rate_per_kwh: 0.02781}

defaults:
  - where: {type: ev}  # these EVs charge on plug-in, the behavior this example is about (the library's default is a TOU timer)
    set: {device: {counterfactual: {type: rule_based_ev}}}
  - set: {premise: {exclusive_import_export: true}} # no importing and exporting in the same hour (each home needs both limits)

analyses:
  feeder:
    value_streams:
      - {type: capacity_deferral, element: tx_1, value_per_kw: 40.0}
