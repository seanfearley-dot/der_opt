# Twenty homes on two 50 kW service transformers through a three-day heat wave -- the
# first multi-premise (feeder) study. Run with:
#   der-opt run examples/scenarios/feeder_ev_heat_wave.yaml -o out/feeder
#
# The homes are synthetic, in the input data spec: ../data/heat_wave/devices.csv lists
# each one's solar, battery and EV; timeseries.csv has its load (with AC following the
# heat wave), solar, and EV plug-in and driving. Transformer A has high EV adoption, B
# low. The feeder analysis compares three dispatches of the same homes: coordinated (one
# optimization over all homes and both transformers), independent (each home optimizing
# its own bill, blind to the transformer), and today's rule-based behavior (EVs charge on
# plug-in, batteries self-consume).

extends:
  - ../library/time/2026-07-13T12_72x60min.yaml
  - ../library/study/homes_bill.yaml # each home's own bill; EVs charge on plug-in, batteries self-consume in R1

name: two_transformer_heat_wave

# every home on E-ELEC with NBT (premises.csv); solar homes export, the rest just buy
population:
  premises: ../data/heat_wave/premises.csv
  devices: ../data/heat_wave/devices.csv
  timeseries: [../data/heat_wave/timeseries.csv]

tariffs:
  dir: ../data/tariffs
  programs:
    nbt: {export_rates_csv: ../data/pge_nbt_eec_2026.csv, acc_plus_per_kwh: 0.0088}

defaults:
  - where: {type: ev}  # these EVs charge on plug-in, the behavior this example is about (the library's default is a TOU timer)
    set: {device: {counterfactual: {type: rule_based_ev}}}
  - set:
      premise:
        poi_limit_kw: 30
        # left off so the run stays an LP and congestion prices are exact duals. Here one
        # battery home imports and exports 3.6 kWh in the same hour (an NBT delivery credit
        # above the import rate), worth $0.01; set true to forbid it (prices then come from
        # fix-and-resolve).
        exclusive_import_export: false
  - where: {type: battery} # sizes are in devices.csv
    set: {device: {eta_charge: 0.96, eta_discharge: 0.96, degradation_cost_per_kwh: 0.015, charge_sources: [solar]}}
  - where: {type: ev}
    set: {device: {degradation_cost_per_kwh: 0.0}}

analyses:
  feeder:
    elements:
      - name: lateral
        rating_kw: 200
      - name: tx_a
        parent: lateral
        rating_kw: 50 # 50 kVA pole-top at unity power factor
        # soft limit: flow can exceed the rating at this cost per kWh over, standing in
        # for transformer loss of life (illustrative, not a sourced value)
        overload_cost_per_kwh: 1.0
      - name: tx_b
        parent: lateral
        rating_kw: 50
        overload_cost_per_kwh: 1.0
    value_streams:
      # avoided upgrade cost on transformer A, $ per kW of peak load. An annual $/kW-year
      # applied to this run's peak, i.e. treats this heat wave as the year's peak
      # (illustrative, not a sourced value).
      - type: capacity_deferral
        element: tx_a
        value_per_kw: 40.0
