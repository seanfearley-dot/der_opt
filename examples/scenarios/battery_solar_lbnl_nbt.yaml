# Battery + solar on real reference data, entirely from YAML -- the config-driven
# reproduction of examples/04_battery_solar_lbnl_reference.py. Run with:
#   der-opt run examples/scenarios/battery_solar_lbnl_nbt.yaml --duals -o /tmp/out
#
# Needs /Users/seanearley/Documents/LBNL_Phase_4 (not part of this repo).
# Import price is PG&E's E-ELEC rate; export is PG&E's real 2026 NBT rate, which can
# exceed import price for a few summer-evening hours -- hence exclusive_import_export.

name: lbnl_reference_house

time_grid:
  resolution_minutes: 60
  horizon_steps: 168 # 7 days
  start: "2025-07-15T00:00:00"

devices:
  - type: solar
    name: solar
    params:
      available_kw:
        source: lbnl_pv
        scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
        cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
        start_hour_ending: 4681 # mid-July

  - type: battery
    name: battery
    params:
      capacity_kwh: 13.5
      p_max_charge_kw: 5.0
      p_max_discharge_kw: 5.0
      eta_charge: 0.96
      eta_discharge: 0.96
      soc_init_frac: 0.5
      degradation_cost_per_kwh: 0.015
      # no soc_final_min_frac: see the Python example's comment -- a terminal floor
      # here would also need to apply fairly to any counterfactual comparison.
      # (charge_sources: [solar] would restrict this battery to charging only from
      # concurrent solar generation -- not used here, to match examples/04 exactly,
      # but available; see the README's device reference.)

value_streams:
  - type: energy_arbitrage
    params:
      import_price:
        type: retail_tariff # PG&E E-ELEC, the rate NBT customers are required to be on
        path: examples/data/tariffs/pge_e_elec_2026-06.yaml
      export_price:
        type: nbt_export
        csv_path: examples/data/pge_nbt_eec_2026.csv
        adder_per_kwh: 0.0088 # ACC Plus, 2026 residential applicants

external_load:
  source: lbnl_gross_load
  scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
  cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
  start_hour_ending: 4681

poi_limit_kw: 15.0
exclusive_import_export: true

# The baseline to compare against: a battery running plain self-consumption (charge
# from solar surplus, discharge to cover load, no price awareness) -- roughly what an
# off-the-shelf home battery does. Solar isn't listed, so it generates everything
# available, as it would in reality.
counterfactual:
  policies:
    battery: {type: self_consumption}

# Bill both runs the way PG&E would: E-ELEC charges, NBT export credits (generation and
# delivery halves offsetting only their own charges), ACC Plus, base services charge.
billing:
  tariff: examples/data/tariffs/pge_e_elec_2026-06.yaml
  income_tier: 3
  program:
    type: nbt
    export_rates_csv: examples/data/pge_nbt_eec_2026.csv
    acc_plus_per_kwh: 0.0088
