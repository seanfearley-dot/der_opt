# A home battery in a summer demand response program, for a full year -- the reference
# for DR studies (docs/DR_CAPACITY_SPEC.md). Run with:
#   der-opt run examples/scenarios/dr_battery_annual.yaml -o out/dr
#
# The home is synthetic (../data/spec_sample/annual_home.csv, input data spec):
# gross load with an AC that follows an inland California climate, and rooftop solar.
# Prices: E-ELEC import; a flat $0.05/kWh for export keeps this a fast LP (a real NBT
# export rate can exceed import, which needs exclusive_import_export, a MILP).
# R1, the counterfactual, is the battery running self-consumption; R3 is the home
# without the battery. The program, cost-test settings and their values are in the
# library blocks; the values are illustrative.

extends:
  - ../library/time/year_2026.yaml
  - ../library/devices/battery_13kwh.yaml
  - ../library/value_streams/pge_e_elec_2026-06_import.yaml
  - ../library/meter/panel_20kw.yaml
  - ../library/counterfactual/battery_self_consumption.yaml
  - ../library/programs/summer_peak_incentive.yaml
  - ../library/cost_tests/synthetic_2026.yaml

name: dr_battery_annual
weather_case: synthetic typical year (illustrative)

devices:
  - type: solar
    name: solar
    params:
      available_kw: {source: timeseries, path: ../data/spec_sample/annual_home.csv, premise_id: home_a, column: pv_kw}

external_load: {source: timeseries, path: ../data/spec_sample/annual_home.csv, premise_id: home_a, column: load_kw}
