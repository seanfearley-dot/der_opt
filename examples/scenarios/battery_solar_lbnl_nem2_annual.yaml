# Battery + solar for a full year under NEM 2.0 (PG&E Schedule NEM2) on E-TOU-C, using
# the same LBNL household as battery_solar_lbnl_nbt_annual.yaml -- run both to compare
# the two programs.
#   der-opt run examples/scenarios/battery_solar_lbnl_nem2_annual.yaml -o out/nem2
# Takes ~5 seconds. Needs /Users/seanearley/Documents/LBNL_Phase_4.
#
# Under NEM2 an exported kWh is credited at the same rate an imported kWh in that TOU
# period costs (less non-bypassable charges), so a battery is worth little beyond
# shifting solar from off-peak to the 4-9 pm peak.

name: lbnl_reference_house_annual_nem2

time_grid:
  resolution_minutes: 60
  horizon_steps: 8760 # one year
  start: "2026-01-01T00:00:00"

devices:
  - type: solar
    name: solar
    params:
      available_kw:
        source: lbnl_pv
        scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
        cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
        start_hour_ending: 1 # Jan 1

  - type: battery
    name: battery
    params:
      capacity_kwh: 13.5
      p_max_charge_kw: 5.0
      p_max_discharge_kw: 5.0
      eta_charge: 0.96
      eta_discharge: 0.96
      soc_init_frac: 0.5
      degradation_cost_per_kwh: 0.015
      # NEM2 "No Grid Charging" (Schedule NEM2 Special Condition 9): the battery charges
      # only from the solar, so everything it exports is renewable and earns NEM credit.
      # This is how a residential battery added to a NEM2 system is usually set up.
      charge_sources: [solar]
      # no soc_final_min_frac: a terminal floor would also need to apply fairly to the
      # counterfactual comparison.

value_streams:
  # Optimize the NEM2 bill in the billing section below.
  - type: nem2_bill

external_load:
  source: lbnl_gross_load
  scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
  cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
  start_hour_ending: 1

poi_limit_kw: 15.0
# Not needed under NEM2: an import and an export in the same hour net at the same
# rate, so there's nothing to gain from both. (Without it the solve is ~5 s, not ~30.)
exclusive_import_export: false

# The baseline to compare against: a battery running plain self-consumption (charge
# from solar surplus, discharge to cover load, no price awareness) -- roughly what an
# off-the-shelf home battery does. Solar isn't listed, so it generates everything
# available, as it would in reality.
counterfactual:
  policies:
    battery: {type: self_consumption}

# Bill both runs the way PG&E would under NEM2: net kWh by TOU period each month at the
# E-TOU-C rate, non-bypassable charges on imports, the base services charge monthly, and
# the baseline credit; energy settles at the 12-month true-up.
billing:
  tariff: ../data/tariffs/pge_e_tou_c_2026-06.yaml
  income_tier: 3
  baseline_territory: R # assumed: Central Valley, to match the LBNL hot-dry climate; edit for a real customer
  baseline_code: basic
  program:
    type: nem2
    nsc_rate_per_kwh: 0.02781 # PG&E's latest published NSC rate (Nov 2026 true-ups)
