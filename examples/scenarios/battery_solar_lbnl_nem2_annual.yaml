# Battery + solar for a full year under NEM 2.0 (PG&E Schedule NEM2) on E-TOU-C, using
# the same LBNL household as battery_solar_lbnl_nbt_annual.yaml -- run both to compare
# the two programs.
#   der-opt run examples/scenarios/battery_solar_lbnl_nem2_annual.yaml -o out/nem2
# Takes ~5 seconds. Needs /Users/seanearley/Documents/LBNL_Phase_4.
#
# Under NEM2 an exported kWh is credited at the same rate an imported kWh in that TOU
# period costs (less non-bypassable charges), so a battery is worth little beyond
# shifting solar from off-peak to the 4-9 pm peak. Simultaneous import and export is
# allowed: under NEM2 they net at the same rate, so there's nothing to gain from both
# (and the solve is ~5 s, not ~30).

extends:
  - ../library/time/year_2026.yaml
  - ../library/devices/battery_13kwh.yaml
  - ../library/value_streams/bill.yaml
  - ../library/meter/panel_15kw.yaml
  - ../library/counterfactual/battery_self_consumption.yaml
  - ../library/billing/pge_e_tou_c_2026-06_nem2.yaml

name: lbnl_reference_house_annual_nem2

devices:
  - type: solar
    name: solar
    params:
      available_kw:
        source: lbnl_pv
        scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
        cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
        start_hour_ending: 1
  - name: battery # library battery_13kwh, changed:
    params:
      eta_charge: 0.96
      eta_discharge: 0.96
      # no terminal floor: the self-consumption counterfactual can't be held to one, so
      # neither run gets one -- same starting charge, end state free (der-opt run warns
      # if they end differently)
      soc_final_min_frac: null
      # NEM2 "No Grid Charging" (Schedule NEM2 Special Condition 9): the battery charges
      # only from the solar, so everything it exports is renewable and earns NEM credit.
      # This is how a residential battery added to a NEM2 system is usually set up.
      charge_sources: [solar]

external_load:
  source: lbnl_gross_load
  scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
  cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
  start_hour_ending: 1

billing:
  baseline_territory: R # assumed: Central Valley, to match the LBNL hot-dry climate; edit for a real customer
