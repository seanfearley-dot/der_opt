# A home with a commuter's V2X EV for a full year, described by a daily pattern instead
# of a per-hour plug-in schedule (docs/EV_PATTERN_SPEC.md). Run with:
#   der-opt run examples/scenarios/ev_commuter_annual.yaml -o out/ev
#
# The home is the synthetic one in ../data/spec_sample/annual_home.csv (its solar
# isn't used here). Prices: E-ELEC import; a flat $0.05/kWh for export, as in
# dr_battery_annual.yaml, keeps this a fast LP. The baseline plugs in and charges at
# full power until full, never discharging. For a car without V2X, extend
# ../library/devices/ev_commuter_charge_only.yaml instead.

extends:
  - ../library/time/year_2026.yaml
  - ../library/devices/ev_commuter_v2x.yaml
  - ../library/value_streams/pge_e_elec_2026-06_import.yaml
  - ../library/meter/panel_20kw.yaml
  - ../library/counterfactual/ev_plug_and_charge.yaml

name: ev_commuter_annual

external_load: {source: timeseries, path: ../data/spec_sample/annual_home.csv, premise_id: home_a, column: load_kw}
