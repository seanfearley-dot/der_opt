# Battery + solar for a full year on real LBNL load/PV, real E-ELEC import rates, and
# real NBT export rates, billed through a 12-cycle Relevant Period with true-up.
#   der-opt run examples/scenarios/battery_solar_lbnl_nbt_annual.yaml -o out/annual
# Takes about a minute (no simultaneous import and export adds a yes/no per hour;
# without it the solve is ~4 s, but the bill objective then imports and exports in the
# same hour on some summer evenings, when the delivery export credit beats the delivery
# import rate). Needs /Users/seanearley/Documents/LBNL_Phase_4.
#
# This household exports more than it uses. Optimizing export value (energy_arbitrage)
# chases generation credit that has nothing left to offset and makes the bill worse
# than a plain self-consumption battery; optimizing the bill doesn't. See the README's
# "Billing" section.
#
# Net Surplus Compensation isn't computed here: add nsc_rate_per_kwh and
# nsc_debit_rate_per_kwh to billing.program (PG&E publishes both monthly).
# The naive alternative to optimizing the bill values every exported kWh at the full
# export rate; to see it, replace extends' value_streams/bill.yaml with:
#   value_streams:
#     - type: energy_arbitrage
#       params:
#         import_price: {type: retail_tariff, path: ../data/tariffs/pge_e_elec_2026-06.yaml}
#         export_price: {type: nbt_export, csv_path: ../data/pge_nbt_eec_2026.csv, adder_per_kwh: 0.0088}

extends:
  - ../library/time/year_2026.yaml
  - ../library/devices/battery_13kwh.yaml
  - ../library/value_streams/bill.yaml
  - ../library/meter/panel_15kw.yaml
  - ../library/meter/no_simultaneous_import_export.yaml
  - ../library/counterfactual/battery_self_consumption.yaml
  - ../library/billing/pge_e_elec_2026-06_nbt.yaml

name: lbnl_reference_house_annual

devices:
  - type: solar
    name: solar
    params:
      available_kw:
        source: lbnl_pv
        scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
        cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
        start_hour_ending: 1
  - name: battery # library battery_13kwh, changed:
    params:
      eta_charge: 0.96
      eta_discharge: 0.96
      # no terminal floor: the self-consumption counterfactual can't be held to one, so
      # neither run gets one -- same starting charge, end state free (der-opt run warns
      # if they end differently)
      soc_final_min_frac: null

external_load:
  source: lbnl_gross_load
  scenario_dir: /Users/seanearley/Documents/LBNL_Phase_4/anonymized-1in2-midDemand-with_EE_FS-2025
  cluster_name: res-pge-res_unknown-allSize-hot_dry-nonCare-NoLCA-AllDay-0_50pct
  start_hour_ending: 1
