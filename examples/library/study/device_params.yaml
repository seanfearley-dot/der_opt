# der-opt starter library block (examples/library/README.md). Values marked illustrative are placeholders: copy the library and set your own.
# battery and EV behavior for a study's premises
# Device behavior for a study's batteries and EVs (sizes come from devices.csv).
defaults:
  - where: {type: battery}
    set: {device: {eta_charge: 0.96, eta_discharge: 0.96, degradation_cost_per_kwh: 0.015, charge_sources: [solar]}}
  - where: {type: ev}
    set: {device: {degradation_cost_per_kwh: 0.0}}
