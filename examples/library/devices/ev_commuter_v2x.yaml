# der-opt starter library block (examples/library/README.md). Values marked illustrative are placeholders: copy the library and set your own.
# 75 kWh V2X EV, commuting 38 mi weekdays, 20 weekends
# A commuter's V2X EV, described by a daily pattern (docs/EV_PATTERN_SPEC.md).
devices:
  - type: ev_v2x
    name: ev
    params:
      capacity_kwh: 75.0
      p_max_charge_kw: 7.2
      p_max_discharge_kw: 7.2 # V2X
      eta_charge: 0.92
      eta_discharge: 0.92
      soc_init_frac: 0.8
      soc_min_frac: 0.2 # never below 20%, whatever export pays
      soc_departure_min_frac: 0.8 # at every departure the pattern makes
      soc_final_min_frac: 0.8
      degradation_cost_per_kwh: 0.02 # illustrative
      smoothing_cost_per_kw: 0.10 # $/kW of change hour to hour: steady output, no cycling through the grid (steers only; never reported)
      pattern:
        weekday: {depart: "07:30", arrive: "18:30", miles: 38}
        weekend: {depart: "10:00", arrive: "15:00", miles: 20}
        kwh_per_mile: 0.30 # drawn from the battery
        holidays: weekend
