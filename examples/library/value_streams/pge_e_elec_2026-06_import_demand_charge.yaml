# der-opt starter library block (examples/library/README.md). Values marked illustrative are placeholders: copy the library and set your own.
# E-ELEC retail import plus a $/kW charge on the run's peak import. E-ELEC has no demand
# charge: the rate is illustrative, for trying peak-shaving value. Lists replace when
# blocks merge, so this restates the energy prices rather than adding to them.
value_streams:
  - type: energy_arbitrage
    params:
      import_price: {type: retail_tariff, path: ../../data/tariffs/pge_e_elec_2026-06.yaml}
      export_price: {type: constant, price: 0.05} # illustrative
  - type: demand_charge
    params: {rate_per_kw: 15.0} # illustrative, $/kW of the peak over the run
