# der-opt starter library block (examples/library/README.md). Values marked illustrative are placeholders: copy the library and set your own.
# Every house on a feeder optimizes its own bill (nbt_bill or nem2_bill by its export
# program), against rule-based EV charging and self-consumption batteries.
house_defaults:
  value_streams:
    - type: bill
  counterfactual:
    policies:
      ev: {type: rule_based_ev}
      battery: {type: self_consumption}
